name: Editorial checks

on:
  push:
    branches: [editorial]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: editorial-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AR_CONTENT_SOURCE: fixture
      PATO_SITE_VISIBILITY: internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund
      - run: npm run legal:check
      - run: npm run check
